# Public CI: lint and tests WITHOUT any ROM (see CAHIER_DES_CHARGES.md, section 5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "server[dev]"
      - run: ruff check server tests docker tools
      - run: python -m pytest tests/server -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test ../relay/test/relay.test.mjs   # the ticket relay (relay/)

  # Interface tests (ui/e2e, Playwright) on the fictional decomp, in Playwright's image as on a developer's computer
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: sh e2e/linux.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: ui/test-results/
