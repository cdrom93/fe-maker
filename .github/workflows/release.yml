# A release: pushing a tag v* builds the package (zip, used by the automatic update) and the Windows installer, and
# publishes them as a pre-release (the user's choice, 14/11: Claude handles the releases; the tag stays on his word). Run by hand (workflow_dispatch), it only builds them and
# keeps them as the run's artifact: to try the installer before a tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"   # the installer's embeddable Python (tools/make_installer.py, EMBED_VERSION)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: ui
      - run: python tools/make_release.py
      - run: choco install innosetup --no-progress -y
      - run: python tools/make_installer.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fe-maker-windows
          path: |
            dist/*.zip
            dist/*.exe
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe --prerelease --notes-file CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash   # the globs
        env:
          GH_TOKEN: ${{ github.token }}
