# The build image on ghcr.io, tagged with the hash of its sources (fe_maker.builder.image_tag): FE Maker pulls it
# instead of compiling agbcc on the user's computer. agbcc is GPL: its sources are linked from CREDITS.md.
name: Build image

on:
  push:
    branches: [main]
    paths: ["docker/Dockerfile", "docker/entrypoint.sh"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: tag
        working-directory: server
        run: echo "tag=$(python -c 'from fe_maker.builder import image_tag; print(image_tag())')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${{ github.repository_owner }}/fe-maker-build:${{ steps.tag.outputs.tag }}
          docker build -t "$image" docker
          docker push "$image"
