[pytest]
testpaths = tests/server
# Only failures are printed in full (one dot per test otherwise); add -s or -v to see more.
addopts = -q --no-header --tb=short -rfE --strict-markers --import-mode=importlib
pythonpath = server tests/local
markers =
    data: characters, classes, items, combat stats, supports
    skills: skills
    maps: maps, tiles, map objects and changes
    events: events, dialogues, chapters' flow, objectives
    media: portraits, palettes, battle animations, map sprites, icons, music
    options: game options and test start options
    build: project folder, migrations, build, patches, release
    app: validation, emulator, tickets, languages, FE-Repo, server
