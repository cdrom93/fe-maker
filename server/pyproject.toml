[project]
name = "fe-maker"
version = "0.1.0"
description = "FE Maker local server"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["fe_maker*"]

[tool.pytest.ini_options]
testpaths = ["../tests/server"]

# Lint settings: see ruff.toml at the repository root.
